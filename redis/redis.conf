# Redis config for the user-api data store.

bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 300
timeout 0

# Persistence: AOF (durable) + periodic RDB snapshots.
dir /data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Memory. Never silently drop user records.
maxmemory-policy noeviction

loglevel notice
