apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: user-api

resources:
  - namespace.yaml
  - redis-secret.yaml
  - redis-pvc.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - api-configmap.yaml
  - api-secret.yaml
  - api-deployment.yaml
  - api-service.yaml
  - ingress.yaml
  - seed-job.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: user-api
    includeSelectors: false

# Central place to bump image tags.
images:
  - name: ahceneaiti/api-rest
    newTag: "1.0"
  - name: ahceneaiti/redis
    newTag: "1.0"
