apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-api
  namespace: user-api
spec:
  ingressClassName: nginx
  rules:
    - host: user-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-api
                port:
                  number: 80
